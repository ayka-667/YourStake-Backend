# YourStake backend - nginx reverse proxy
#
# 1. Copy to /etc/nginx/sites-available/yourstake-backend
# 2. Replace api.yourstake.fr with your domain
# 3. ln -s /etc/nginx/sites-available/yourstake-backend /etc/nginx/sites-enabled/
# 4. nginx -t && systemctl reload nginx
# 5. HTTPS: certbot --nginx -d api.yourstake.fr
#
# The Upgrade/Connection headers are mandatory for Socket.IO (websockets).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yourstake.fr;

    # Frontend uploads / avatars
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:5001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived websocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
